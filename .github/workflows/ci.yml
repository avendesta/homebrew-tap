name: Check casks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Tap this repository
        run: brew tap avendesta/tap "$GITHUB_WORKSPACE"
      - name: Style
        run: brew style --cask avendesta/tap/rekord
      - name: Audit
        run: brew audit --cask --strict --online avendesta/tap/rekord
